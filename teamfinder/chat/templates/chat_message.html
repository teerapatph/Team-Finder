{% if message.author == user %}
<li class="tw-flex tw-justify-end tw-mb-4">
    <div class="tw-bg-red-200 tw-rounded-full tw-px-4 tw-py-2 tw-max-w-[75%]">
        <span>{{ message.body }}</span>
    </div>
</li>
{% else %}
<li>
    <div class="tw-flex tw-justify-start">
        <a href="/profile/{{message.author.username}}" target="_blank">
            <span class="tw-text-gray-500">{{ message.author.name }}</span>
        </a>
    </div>
    <div class="tw-flex tw-justify-start">
        <a href="/profile/{{message.author.username}}" target="_blank">
            <img src="{{ message.author.profile.image_url|default:'/media/images/fallback.png' }}" 
                 onerror="this.onerror=null; this.src='/media/images/fallback.png';" 
                 alt="{{ message.author.name }}" 
                 class="profile-pic">
        </a>
        <div class="tw-bg-gray-200 tw-px-4 tw-py-2 tw-max-w-[75%] tw-rounded-full">
            <span>{{ message.body }}</span>
        </div>  
    </div>
</li>

{% endif %}
